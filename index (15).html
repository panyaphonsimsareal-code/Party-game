<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party-game</title>
<meta name="theme-color" content="#3E8EEB">
<style>
html,body{margin:0;height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#3E8EEB 0%,#6FB2F6 55%,#BFE2FF 100%);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Thonburi",sans-serif;color:#fff;overflow:hidden;-webkit-user-select:none;user-select:none}
.box{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(78vw,340px);text-align:center}
.pad{width:min(34vw,120px);height:auto;filter:drop-shadow(0 6px 10px rgba(20,60,140,.3))}
h1{margin:0;font:800 clamp(28px,8vw,40px)/1.1 system-ui,sans-serif;text-shadow:0 3px 0 #1E5FC0,0 8px 18px rgba(20,60,140,.35)}
.msg{margin:0;font-weight:600;font-size:15px;text-shadow:0 2px 6px rgba(20,60,140,.45)}
.bar{width:100%;height:16px;border-radius:99px;background:rgba(255,255,255,.35);box-shadow:inset 0 2px 4px rgba(20,60,140,.2);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:#FF7A3D;transition:width .25s ease}
.pct{font:800 16px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.cl{position:absolute;opacity:.85;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}

@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style></head>
<body>
<svg class="cl" style="left:6%;top:14%;width:90px" viewBox="0 0 120 60" aria-hidden="true"><path fill="#fff" d="M20 58a18 18 0 0 1 4-35 24 24 0 0 1 44-8 18 18 0 0 1 30 10 16 16 0 0 1 2 33z"/></svg>
<svg class="cl" style="right:7%;bottom:16%;width:110px;animation-delay:-3s" viewBox="0 0 120 60" aria-hidden="true"><path fill="#fff" d="M20 58a18 18 0 0 1 4-35 24 24 0 0 1 44-8 18 18 0 0 1 30 10 16 16 0 0 1 2 33z"/></svg>
<div class="box" role="progressbar" aria-label="กำลังโหลดเกม" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb">
  <svg class="pad" viewBox="40 240 432 212" aria-hidden="true"><path fill="#FF7A3D" d="M150 246H362C410 246 436 270 446 320L462 396C470 436 440 456 410 440C392 430 378 410 366 392Q356 380 340 380H172Q156 380 146 392C134 410 120 430 102 440C72 456 42 436 50 396L66 320C76 270 102 246 150 246Z"/><g fill="#fff"><rect x="138" y="300" width="68" height="22" rx="7"/><rect x="161" y="277" width="22" height="68" rx="7"/><circle cx="352" cy="288" r="14"/><circle cx="375" cy="311" r="14"/><circle cx="352" cy="334" r="14"/><circle cx="329" cy="311" r="14"/></g><rect x="236" y="300" width="40" height="14" rx="7" fill="#1E2757" opacity=".35"/></svg>
  <h1>Party-game</h1>
  <p class="msg" id="msg">กำลังโหลดเกม…</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct">0%</div>
</div>
<noscript><meta http-equiv="refresh" content="0; url=play-1110-3.html"></noscript>
<script>
/* loading page: downloads the game file (big) with a progress bar, then opens it (the browser reuses the downloaded copy).
   Keeps ?t=… (tester link) and #…. If anything goes wrong it just opens the game. */
(function(){
  var GAME="play-1110-3.html", SIZE=6841877, go=GAME+location.search+location.hash, done=false;
  var fill=document.getElementById("fill"), pct=document.getElementById("pct"), pb=document.getElementById("pb"), msg=document.getElementById("msg");
  function show(p){ p=Math.max(0,Math.min(100,Math.round(p))); fill.style.width=p+"%"; pct.textContent=p+"%"; pb.setAttribute("aria-valuenow",p); }
  function open(){ if(done) return; done=true; show(100); msg.textContent="พร้อมแล้ว!"; setTimeout(function(){ location.replace(go); },250); }
  setTimeout(function(){ if(!done) msg.textContent="เน็ตช้านิดหน่อย รอสักครู่นะ…"; },12000);
  setTimeout(open,60000);   // never get stuck here
  if(!window.fetch||!window.ReadableStream||!/^https?:$/.test(location.protocol)){ open(); return; }
  fetch(GAME+location.search).then(function(r){   // same address as the page it opens next, so the browser reuses this download
    if(!r.ok||!r.body){ open(); return; }
    var rd=r.body.getReader(), got=0;
    (function pump(){ rd.read().then(function(x){ if(x.done){ open(); return; } got+=x.value.length; show(Math.min(99,got/SIZE*100)); pump(); }).catch(open); })();
  }).catch(open);
})();
</script>
</body></html>
