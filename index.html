/* loading page: downloads the game file (big) with a progress bar, then opens it (the browser reuses the downloaded copy).
   Keeps ?t=… (tester link) and #…. If anything goes wrong it just opens the game. */
(function(){
  var GAME="play-1113.html", SIZE=7084319, go=GAME+location.search+location.hash, done=false;
  var fill=document.getElementById("fill"), pct=document.getElementById("pct"), pb=document.getElementById("pb"), msg=document.getElementById("msg");
  function show(p){ p=Math.max(0,Math.min(100,Math.round(p))); fill.style.width=p+"%"; pct.textContent=p+"%"; pb.setAttribute("aria-valuenow",p); }
  function open(){ if(done) return; done=true; show(100); msg.textContent="พร้อมแล้ว!"; setTimeout(function(){ location.replace(go); },250); }
  setTimeout(function(){ if(!done) msg.textContent="เน็ตช้านิดหน่อย รอสักครู่นะ…"; },12000);
  setTimeout(open,60000);   // never get stuck here
  if(!window.fetch||!window.ReadableStream||!/^https?:$/.test(location.protocol)){ open(); return; }
  fetch(GAME+location.search).then(function(r){   // same address as the page it opens next, so the browser reuses this download
    if(!r.ok||!r.body){ open(); return; }
    var rd=r.body.getReader(), got=0;
    (function pump(){ rd.read().then(function(x){ if(x.done){ open(); return; } got+=x.value.length; show(Math.min(99,got/SIZE*100)); pump(); }).catch(open); })();
  }).catch(open);
})();
</script>
</body></html>
